name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: |
          rm -rf _site && mkdir -p _site
          cp -r index.html favicon.svg robots.txt site.webmanifest _headers wasm llms.txt _site/
          cp -r icon-192.png icon-512.png apple-touch-icon.png og-image.png og-image.svg _site/ 2>/dev/null || true
      - name: deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=search-vaked-dev --branch=main
